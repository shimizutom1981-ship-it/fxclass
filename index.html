<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fracture Classifier Pro</title>
  <style>
    :root {
      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #212121;
      --text-sub: #616161;
      --accent: #2e7d32;
      --alert: #c62828;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: var(--primary);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      z-index: 10;
    }
    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header-btns {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      background: rgba(255,255,255,0.22);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:active {
      background: rgba(255,255,255,0.4);
    }
    .breadcrumb-bar {
      background: #e3f2fd;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: var(--primary-dark);
      font-weight: 600;
      white-space: nowrap;
      overflow-x: auto;
      border-bottom: 1px solid #bbdefb;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .step-indicator {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.12s ease-in-out;
    }
    .card:active {
      transform: scale(0.97);
      background-color: #e8f0fe;
      border-color: var(--primary);
    }
    .card svg {
      width: 58px;
      height: 58px;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .card-sub {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 4px;
      line-height: 1.3;
    }
    /* 判定結果カード */
    .result-box {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      border-top: 6px solid var(--accent);
    }
    .result-box.danger {
      border-top-color: var(--alert);
    }
    .result-code {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .result-box.danger .result-code {
      color: var(--alert);
    }
    .result-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    .result-detail {
      font-size: 0.88rem;
      color: #333;
      line-height: 1.55;
      background: #f8f9fa;
      padding: 10px 12px;
      border-radius: 8px;
    }
    .result-clinical {
      font-size: 0.86rem;
      color: #b71c1c;
      background: #ffebee;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.5;
      font-weight: 600;
    }
    .copy-btn {
      margin-top: 16px;
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .copy-btn:active {
      background-color: var(--primary-dark);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(33, 33, 33, 0.92);
      color: white;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

    // アプリケーションクラス
    class ClassifierPro {
      constructor(data) {
        this.data = data;
        this.history = [];
        this.currentView = document.getElementById("app-view");
        this.breadcrumb = document.getElementById("breadcrumb");
        this.toast = document.getElementById("toast");
        this.render();
      }

      getCurrentNode() {
        let node = this.data;
        for (const idx of this.history) {
          node = (node.children ? node.children.items : node.items)[idx];
        }
        return node;
      }

      select(index) {
        this.history.push(index);
        this.render();
      }

      back() {
        if (this.history.length > 0) {
          this.history.pop();
          this.render();
        }
      }

      reset() {
        this.history = [];
        this.render();
      }

      copy(text) {
        navigator.clipboard.writeText(text).then(() => {
          this.toast.style.opacity = "1";
          setTimeout(() => {
            this.toast.style.opacity = "0";
          }, 1800);
        });
      }

      render() {
        const currentNode = this.getCurrentNode();
        this.updateBreadcrumb();
        this.currentView.innerHTML = "";

        // 終端：結果画面
        if (currentNode.result) {
          const r = currentNode.result;
          const clipText = `【骨折・外傷診断】\n分類: ${r.code}\n診断名: ${r.title}\n病態・解剖: ${r.detail}\n治療方針: ${r.clinical}`;

          this.currentView.innerHTML = `
            <div class="result-box ${r.danger ? 'danger' : ''}">
              <div class="result-code">${r.code}</div>
              <div class="result-title">${r.title}</div>
              
              <div class="section-label">Pathology & Anatomy</div>
              <div class="result-detail">${r.detail}</div>

              <div class="section-label">Management / Strategy</div>
              <div class="result-clinical">${r.clinical}</div>

              <button class="copy-btn" onclick="app.copy(\`${clipText.replace(/\n/g, '\\n')}\`)">
                📋 カルテ・サマリー用にコピー
              </button>
            </div>
          `;
          return;
        }

        // 次の選択肢リストがある場合
        const targetList = currentNode.children ? currentNode.children : currentNode;
        const items = targetList.items;

        const headerTitle = document.createElement("div");
        headerTitle.className = "step-indicator";
        headerTitle.innerText = targetList.title || "選択してください";
        this.currentView.appendChild(headerTitle);

        const grid = document.createElement("div");
        grid.className = "grid";

        items.forEach((item, idx) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            ${item.icon || ''}
            <div class="card-title">${item.title}</div>
            ${item.sub ? `<div class="card-sub">${item.sub}</div>` : ''}
          `;
          card.onclick = () => this.select(idx);
          grid.appendChild(card);
        });

        this.currentView.appendChild(grid);
      }

      updateBreadcrumb() {
        if (this.history.length === 0) {
          this.breadcrumb.innerText = "部位・大分類選択";
          return;
        }
        let labels = ["Top"];
        let node = this.data;
        for (const idx of this.history) {
          node = (node.children ? node.children.items : node.items)[idx];
          labels.push(node.title.split(" ")[0]);
        }
        this.breadcrumb.innerText = labels.join(" > ");
      }
    }

    const app = new ClassifierPro(DATA_TREE);
